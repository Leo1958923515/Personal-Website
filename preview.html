<!DOCTYPE html>

<head>
<meta charset="utf-8" />

<title>Leo · GitHub Profile README 预览</title>
<style>
  :root[data-theme="light"] {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
    --link: #0969da; --code-bg: rgba(129,139,152,.12);
    --hdr-bg: #f6f8fa; --hdr-border: #d1d9e0;
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
    --link: #4493f8; --code-bg: rgba(110,118,129,.4);
    --hdr-bg: #151b23; --hdr-border: #3d444d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial,
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background .2s, color .2s;
  }
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--hdr-bg);
    border-bottom: 1px solid var(--hdr-border);
  }
  .toolbar .brand { font-weight: 600; font-size: 13px; color: var(--muted); margin-right: auto; }
  .toolbar .brand b { color: var(--fg); }
  .btn {
    font: inherit; font-size: 12px; line-height: 20px; cursor: pointer;
    padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); transition: border-color .15s, color .15s;
  }
  .btn:hover { border-color: var(--link); color: var(--link); }
  .btn[aria-pressed="true"] { border-color: var(--link); color: var(--link); font-weight: 600; }
  .wrap { max-width: 1012px; margin: 0 auto; padding: 32px 24px 96px; }
  #md > :first-child { margin-top: 0; }
  #md h3 {
    font-size: 1.25em; font-weight: 600; margin: 32px 0 16px;
    padding-bottom: .3em; border-bottom: 1px solid var(--border);
  }
  #md h4 { font-size: 1em; font-weight: 600; margin: 24px 0 16px; }
  #md p { margin: 0 0 16px; }
  #md a { color: var(--link); text-decoration: none; }
  #md a:hover { text-decoration: underline; }
  #md img { max-width: 100%; vertical-align: middle; }
  #md ul, #md ol { margin: 0 0 16px; padding-left: 2em; }
  #md li { margin: .25em 0; }
  #md li + li { margin-top: .25em; }
  #md blockquote {
    margin: 0 0 16px; padding: 0 1em; color: var(--muted);
    border-left: .25em solid var(--border);
  }
  #md code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 85%; padding: .2em .4em; border-radius: 6px; background: var(--code-bg);
  }
  #md pre { background: var(--code-bg); padding: 16px; border-radius: 6px; overflow: auto; }
  #md pre code { background: none; padding: 0; font-size: 100%; }
  #md hr { height: 1px; border: 0; background: var(--border); margin: 24px 0; }
  #md details { margin-bottom: 16px; }
  #md summary { cursor: pointer; font-weight: 600; }
  #md summary:hover { color: var(--link); }
  #md sub { font-size: 75%; color: var(--muted); }
  #md .ph {
    background: #fff8c5; color: #9a6700; border: 1px dashed #d4a72c;
    border-radius: 4px; padding: 0 4px; font-size: 85%; font-family: ui-monospace, Menlo, Consolas, monospace;
    word-break: break-all;
  }
  :root[data-theme="dark"] #md .ph { background: #3a2d12; color: #e3b341; border-color: #9e6a03; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px);
    background: #1f2328; color: #fff; font-size: 13px;
    padding: 8px 16px; border-radius: 8px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 50;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

<script type="application/json" id="src">"<!--\n  GitHub Profile README\n  ────────────────────────────────────────────────────────────\n  使用方法：把本文件放到「与你 GitHub 用户名同名的仓库」里作为 README.md\n  仓库名 = Leo1958923515（大小写必须一致，且仓库必须是 Public），提交后即显示在你的 GitHub 主页顶部。\n  搜索 \"✏️\" 可定位全部待替换占位内容（注释本身不会显示在主页上，但它旁边的文字会显示）。\n  逐项替换说明见同目录 CUSTOMIZE.md。\n-->\n\n<div align=\"center\">\n\n  [![Typing SVG](https://readme-typing-svg.herokuapp.com?font=JetBrains+Mono&weight=600&size=28&duration=3000&pause=1000&color=2F81F7&center=true&vCenter=true&random=false&width=720&lines=Hi+%F0%9F%91%8B%2C+I'm+Leo;Robotics+Engineering+Undergraduate)](https://git.io/typing-svg)\n\n  <a href=\"https://space.bilibili.com/1951988324\">\n    <img src=\"https://img.shields.io/badge/Bilibili-FB7299?style=for-the-badge&logo=bilibili&logoColor=white\" alt=\"Bilibili\" />\n  <\/a>\n  <a href=\"https://www.zhihu.com/people/leo-18-7-39\">\n    <img src=\"https://img.shields.io/badge/Zhihu-0066FF?style=for-the-badge&logo=zhihu&logoColor=white\" alt=\"Zhihu\" />\n  <\/a>\n  <a href=\"https://github.com/Leo1958923515?tab=repositories\">\n    <img src=\"https://img.shields.io/badge/Open_Source-181717?style=for-the-badge&logo=github&logoColor=white\" alt=\"Open-source projects\" />\n  <\/a>\n  <a href=\"https://www.robomaster.com/zh-CN\">\n    <img src=\"https://img.shields.io/badge/RoboMaster-0087EE?style=for-the-badge&logo=dji&logoColor=white\" alt=\"RoboMaster\" />\n  <\/a>\n\n<\/div>\n\n### 🚀 About Me\n\nI'm **Leo**, an undergraduate majoring in **Robotics Engineering** at **GMU**. <!-- ✏️ 确认或修改你的学校与专业 -->\n\nWhat really draws me in is turning the ideas in my head into something real that actually moves — and exploring that layer where mechanics, electronics and code meet. <!-- ✏️ 换成你自己的兴趣表述 -->\n\nRight now I'm building the foundations: **C / C++ and Python**, plus **OpenCV** and **Deep Learning**. <!-- ✏️ 学习方向有变就改这里 -->\n\nI like learning by building: writing small projects end-to-end, breaking them, fixing them, and then writing down what I learned along the way. My goal is simple — get a little better every single day, and build a portfolio I can actually point to. <!-- ✏️ 换成你的个人风格自述 -->\n\n<details>\n  <summary><b>中文版个人简介（点击展开）<\/b><\/summary>\n  <br />\n  <p>你好，我是 <b>Leo<\/b>，GMU 机器人工程专业在读。 <!-- ✏️ 身份 --><\/p>\n  <p>真正让我着迷的是把脑子里的想法变成一个能跑能动的实物，去探索机械、电控与代码交界的那一层。 <!-- ✏️ 兴趣表述 --><\/p>\n  <p>目前正在打基础：C / C++ 与 Python，OpenCV 与深度学习。 <!-- ✏️ 方向 --><\/p>\n  <p>我习惯「边做边学」：完整写完一个小项目、把它跑崩、再把它修好，然后把过程中的心得记录下来。目标很简单——每天进步一点点，并留下可验证的作品集。 <!-- ✏️ 自述 --><\/p>\n<\/details>\n\n---\n\n### 🔭 Current Work\n\n- **📚 Learning** — C / C++ programming, OpenCV and Deep Learning <!-- ✏️ 学习清单 -->\n- **🛠 Building** — <!-- ✏️ --> small projects and hands-on experiments, all documented in my repositories\n- **📺 Sharing** — study notes and project logs on **[Bilibili](https://space.bilibili.com/1951988324)** and **[Zhihu](https://www.zhihu.com/people/leo-18-7-39)**\n- **🎯 Goal for this year** — Join the **RoboMaster lab** at my school and grow quickly through hands-on practice.\n\n---\n\n### 📸 Selected Projects\n\n<!-- ✏️ 加新项目就按下面同样的格式复制一行：- **[项目名](仓库链接)** — 一句话亮点 + 反引号技术标签 -->\n\n- **[Personal-Website](https://github.com/Leo1958923515/Personal-Website)** — my GitHub profile page: plain Markdown, shields.io badges, no framework and no build step. I rewrote it about a dozen times, and most of that was deleting things. `Markdown` `shields.io`\n\n<sub>更多项目见 **[我的仓库列表 →](https://github.com/Leo1958923515?tab=repositories)**<\/sub>\n\n---\n\n### 🛠 Technical Stack\n\n#### 💻 Languages & Fundamentals\n\n[![C](https://img.shields.io/badge/C-A8B9CC?style=flat-square&logo=c&logoColor=black)](https://en.cppreference.com/w/c)\n[![C++](https://img.shields.io/badge/C++-00599C?style=flat-square&logo=c%2B%2B&logoColor=white)](https://en.cppreference.com/w/cpp)\n[![Python](https://img.shields.io/badge/Python-3776AB?style=flat-square&logo=python&logoColor=white)](https://www.python.org/)\n\n#### 🧰 Tools & Environment\n\n[![Git](https://img.shields.io/badge/Git-F05032?style=flat-square&logo=git&logoColor=white)](https://git-scm.com/)\n[![GitHub](https://img.shields.io/badge/GitHub-181717?style=flat-square&logo=github&logoColor=white)](https://github.com/Leo1958923515)\n[![VS Code](https://img.shields.io/badge/VS_Code-007ACC?style=flat-square&logo=vscodium&logoColor=white)](https://code.visualstudio.com/)\n[![Linux](https://img.shields.io/badge/Linux-FCC624?style=flat-square&logo=linux&logoColor=black)](https://www.linux.org/)\n[![Markdown](https://img.shields.io/badge/Markdown-000000?style=flat-square&logo=markdown&logoColor=white)](https://www.markdownguide.org/)\n\n#### 🤖 Robotics & AI · Exploring\n\n[![ROS 2](https://img.shields.io/badge/ROS_2-22314E?style=flat-square&logo=ros&logoColor=white)](https://docs.ros.org/)\n[![STM32](https://img.shields.io/badge/STM32-03234B?style=flat-square&logo=stmicroelectronics&logoColor=white)](https://www.st.com/en/microcontrollers-microprocessors/stm32-32-bit-arm-cortex-mcus.html)\n[![NumPy](https://img.shields.io/badge/NumPy-013243?style=flat-square&logo=numpy&logoColor=white)](https://numpy.org/)\n[![PyTorch](https://img.shields.io/badge/PyTorch-EE4C2C?style=flat-square&logo=pytorch&logoColor=white)](https://pytorch.org/)\n[![OpenCV](https://img.shields.io/badge/OpenCV-5C3EE8?style=flat-square&logo=opencv&logoColor=white)](https://opencv.org/)\n\n---\n\n### 🤝 Connect with Me\n\n<p>\n  <a href=\"mailto:1958923515@qq.com\"><img src=\"https://img.shields.io/badge/Email-1958923515@qq.com-red?style=flat&logo=gmail&logoColor=white\" height=\"25\" alt=\"Email\" /><\/a>&nbsp;\n  <a href=\"https://github.com/Leo1958923515\"><img src=\"https://img.shields.io/badge/GitHub-Leo1958923515-181717?style=flat&logo=github&logoColor=white\" height=\"25\" alt=\"GitHub\" /><\/a>&nbsp;\n  <a href=\"https://space.bilibili.com/1951988324\"><img src=\"https://img.shields.io/badge/Bilibili-LeoLGC-FB7299?style=flat&logo=bilibili&logoColor=white\" height=\"25\" alt=\"Bilibili · LeoLGC\" /><\/a>&nbsp;\n  <a href=\"https://www.zhihu.com/people/leo-18-7-39\"><img src=\"https://img.shields.io/badge/Zhihu-LeoLGC-0066FF?style=flat&logo=zhihu&logoColor=white\" height=\"25\" alt=\"Zhihu · LeoLGC\" /><\/a>\n  <!-- ✏️ 想加更多平台？按上面同样格式复制一行即可，例如个人主页：\n  &nbsp;<a href=\"https://你的主页\"><img src=\"https://img.shields.io/badge/Portfolio-Personal_Homepage-blue?style=flat&logo=google-chrome&logoColor=white\" height=\"25\" alt=\"Portfolio\" /><\/a> -->\n<\/p>\n\n---\n\n<p align=\"center\">\n  𝐶𝑢𝑚𝑢𝑙𝑎𝑡𝑖𝑣𝑒 𝑅𝑒𝑤𝑎𝑟𝑑𝑠 𝑒𝑞𝑢𝑎𝑙 𝑅𝑒𝑡𝑢𝑟𝑛. 🪜\n<\/p>\n\n<p align=\"center\">\n  <sub><b>致谢<\/b> —— 本项目的排版完全参考 <a href=\"https://github.com/Lain-Ego0\">@Lain-Ego0<\/a> 的主页，lain佬的机器人工程师学习计划是我的启蒙读物，带我走进了 robotics 的世界。也希望大家多多支持 lain 的 <a href=\"https://locowiki.github.io/index.html\">LocoWiki<\/a> 开源社区。<\/sub>\n<\/p>\n"</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  var raw = JSON.parse(document.getElementById('src').textContent);
  var root = document.getElementById('md');
  var showPH = true;

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function withPlaceholders(md) {
    return md.replace(/<!--\s*✏️([\s\S]*?)-->/g, function (_, body) {
      return '<mark class="ph">✏️' + escapeHtml(body).replace(/\s*\n\s*/g, ' ') + '</mark>';
    });
  }
  function render() {
    var md = showPH ? withPlaceholders(raw) : raw;
    if (window.marked) {
      marked.setOptions({ gfm: true, breaks: false, headerIds: false, mangle: false });
      root.innerHTML = marked.parse(md);
    } else {
      root.innerHTML = '<p style="color:#9a6700">未能加载 Markdown 渲染库（需要联网）。' +
        '这不影响 README.md 本身，可直接把它上传到 GitHub 查看效果。</p>';
    }
  }

  document.getElementById('togglePH').addEventListener('click', function () {
    showPH = !showPH;
    this.setAttribute('aria-pressed', String(showPH));
    this.textContent = '高亮占位符：' + (showPH ? '开' : '关');
    render();
  });

  document.getElementById('toggleTheme').addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    this.textContent = dark ? '深色模式' : '浅色模式';
  });

  document.getElementById('copyMd').addEventListener('click', function () {
    var done = function () {
      var t = document.getElementById('toast');
      t.classList.add('on');
      setTimeout(function () { t.classList.remove('on'); }, 1400);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(raw).then(done, fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = raw; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  });

  render();
})();
</script>
